
name: meow
description: Meow - chat privado para amigos
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  http: ^1.2.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/meow_icon.png"
  adaptive_icon_background: "#7828E8"
  adaptive_icon_foreground: "assets/meow_icon.png"

flutter:
  uses-material-design: true
