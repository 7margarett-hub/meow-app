name: meow
description: Meow - chat privado para amigos
publish_to: 'none'
version: 0.9.4+14
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.5
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  http: ^1.2.2
  url_launcher: ^6.3.1
  app_links: ^6.4.0
  share_plus: ^10.1.4
  photo_manager: ^3.6.4
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  video_player: ^2.9.2
  get_thumbnail_video: 0.7.3
  package_info_plus: ^8.0.0
  gal: ^2.3.2
  file_saver: 0.2.14
  characters: ^1.3.0
  scrollable_positioned_list: ^0.3.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/meow_launcher_icon.png"
  adaptive_icon_background: "#7828E8"
  adaptive_icon_foreground: "assets/meow_launcher_foreground.png"
flutter:
  uses-material-design: true
  assets:
    - assets/meow_foreground.png
    - assets/badges/
