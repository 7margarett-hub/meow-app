
name: Meow Admin Setup

on:
  workflow_dispatch:

permissions: {}

jobs:
  setup-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Instalar Firebase Admin SDK
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0

      - name: Configurar administrador Meow
        env:
          FIREBASE_ADMIN_SETUP: ${{ secrets.FIREBASE_ADMIN_SETUP }}
          MEOW_ADMIN_UID: ${{ secrets.MEOW_ADMIN_UID }}
        run: |
          node <<'NODE'
          const admin = require('firebase-admin');

          let stage = 'Validar secrets';

          async function main() {
            const raw = process.env.FIREBASE_ADMIN_SETUP;
            const uid = process.env.MEOW_ADMIN_UID?.trim();

            if (!raw || !raw.trim()) {
              throw new Error('SECRET_FIREBASE_AUSENTE');
            }

            if (!uid) {
              throw new Error('SECRET_UID_AUSENTE');
            }

            console.log('Secrets encontrados.');

            stage = 'Validar JSON';

            let credentials;

            try {
              credentials = JSON.parse(raw);
            } catch {
              throw new Error('JSON_INVALIDO');
            }

            if (credentials.project_id !== 'meow-app-8ac5e') {
              throw new Error('PROJETO_INCORRETO');
            }

            if (credentials.client_email !==
                'meow-admin-setup@meow-app-8ac5e.iam.gserviceaccount.com') {
              throw new Error('CONTA_SERVICO_INCORRETA');
            }

            if (typeof credentials.private_key !== 'string' ||
                !credentials.private_key.includes('BEGIN PRIVATE KEY')) {
              throw new Error('CHAVE_PRIVADA_INVALIDA');
            }

            console.log('Credencial validada.');

            stage = 'Inicializar Firebase';

            admin.initializeApp({
              credential: admin.credential.cert(credentials)
            });

            const auth = admin.auth();

            stage = 'Localizar usuario';

            const user = await auth.getUser(uid);

            console.log('Usuario localizado.');

            stage = 'Atribuir permissao';

            await auth.setCustomUserClaims(uid, {
              ...(user.customClaims || {}),
              meowAdmin: true
            });

            stage = 'Confirmar permissao';

            const updated = await auth.getUser(uid);

            if (updated.customClaims?.meowAdmin !== true) {
              throw new Error('PERMISSAO_NAO_CONFIRMADA');
            }

            console.log('MEOW_ADMIN_SETUP: SUCCESS');
          }

          main().catch(error => {
            const safeErrors = [
              'SECRET_FIREBASE_AUSENTE',
              'SECRET_UID_AUSENTE',
              'JSON_INVALIDO',
              'PROJETO_INCORRETO',
              'CONTA_SERVICO_INCORRETA',
              'CHAVE_PRIVADA_INVALIDA',
              'PERMISSAO_NAO_CONFIRMADA'
            ];

            const code = typeof error.code === 'string' &&
              /^auth\/[a-z-]+$/.test(error.code)
                ? error.code
                : safeErrors.includes(error.message)
                  ? error.message
                  : 'ERRO_INTERNO';

            console.error('ETAPA: ' + stage);
            console.error('ERRO: ' + code);
            process.exit(1);
          });
          NODE
