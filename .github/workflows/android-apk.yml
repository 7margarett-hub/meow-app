
name: Gerar APK Meow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preparar projeto Android
        run: flutter create --platforms=android --project-name=meow .

      - name: Configurar permissoes Android do Meow
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permissions = [
              ('android.permission.INTERNET', ''),
              ('android.permission.POST_NOTIFICATIONS', ''),
              ('android.permission.WRITE_EXTERNAL_STORAGE', ' android:maxSdkVersion="28"'),
          ]
          for name, extra in permissions:
              if name not in text:
                  text = text.replace('<application', f'<uses-permission android:name="{name}"{extra} />\n    <application', 1)
          path.write_text(text)
          PYCODE

      - name: Instalar dependencias
        run: flutter pub get

      - name: Gerar icone oficial do Meow
        run: dart run flutter_launcher_icons

      - name: Verificar configuracao Firebase
        env:
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_SENDER_ID: ${{ secrets.FB_SENDER_ID }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
        run: |
          for key in FB_API_KEY FB_APP_ID FB_SENDER_ID FB_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Configuracao ausente: $key"
              exit 1
            fi
          done

      - name: Gerar APK
        env:
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_SENDER_ID: ${{ secrets.FB_SENDER_ID }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
        run: |
          flutter build apk --debug \
            --dart-define="FB_API_KEY=$FB_API_KEY" \
            --dart-define="FB_APP_ID=$FB_APP_ID" \
            --dart-define="FB_SENDER_ID=$FB_SENDER_ID" \
            --dart-define="FB_PROJECT_ID=$FB_PROJECT_ID"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Meow-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
